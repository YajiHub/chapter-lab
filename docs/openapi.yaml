openapi: "3.1.0"
info: {"title":"ChapterLab API design draft","version":"0.1.0","description":"Planning contract. Published response schemas and examples will be generated and checked against FastAPI. Return correct answers and citations only in feedback after a question is answered in the quiz flow."}
servers: [{"url":"/api"}]
security: [{"session":[]}]
paths:
  "/health":
    get: {"summary":"Check database connectivity and deployed version","security":[],"responses":{"200":{"description":"Health status and deployed commit","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Health"}}}},"503":{"description":"Service or provider unavailable","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Health"}}}}}}
  "/v1/auth/login":
    post: {"summary":"Sign in","security":[],"responses":{"200":{"description":"User role, session cookie and request verification token"},"401":{"description":"Sign-in required or credentials invalid","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"422":{"description":"Invalid request values","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"429":{"description":"Rate limit or generation quota reached","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Credentials"}}}}}
  "/v1/auth/me":
    get: {"summary":"Read the current account and session verification token","responses":{"200":{"description":"Current account and request verification token"},"401":{"description":"Sign-in required or credentials invalid","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Role, account status, or request verification disallows this action","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}}
  "/v1/auth/logout":
    post: {"summary":"End the current session","responses":{"204":{"description":"Session ended"},"401":{"description":"Sign-in required or credentials invalid","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Role, account status, or request verification disallows this action","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"parameters":[{"name":"X-CSRF-Token","in":"header","required":true,"schema":{"type":"string"}}]}
  "/v1/lessons":
    get: {"summary":"List owned lessons","description":"Requires student role.","responses":{"200":{"description":"Page of lesson summaries"},"401":{"description":"Sign-in required or credentials invalid","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Role, account status, or request verification disallows this action","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"422":{"description":"Invalid request values","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"parameters":[{"name":"page","in":"query","schema":{"type":"integer","minimum":1,"default":1}},{"name":"q","in":"query","schema":{"type":"string"}},{"name":"sort","in":"query","schema":{"type":"string","enum":["newest","oldest"],"default":"newest"}}]}
    post: {"summary":"Save lesson notes","description":"Requires student role.","responses":{"201":{"description":"Created lesson"},"401":{"description":"Sign-in required or credentials invalid","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Role, account status, or request verification disallows this action","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"422":{"description":"Invalid request values","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"parameters":[{"name":"X-CSRF-Token","in":"header","required":true,"schema":{"type":"string"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/LessonInput"}}}}}
  "/v1/lessons/{lessonId}":
    get: {"summary":"Read an owned lesson","description":"Requires student role.","responses":{"200":{"description":"Lesson detail"},"401":{"description":"Sign-in required or credentials invalid","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Role, account status, or request verification disallows this action","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"Resource unavailable to this account","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"parameters":[{"name":"lessonId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]}
    put: {"summary":"Replace the title and notes","description":"Requires student role.","responses":{"200":{"description":"Updated lesson"},"401":{"description":"Sign-in required or credentials invalid","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Role, account status, or request verification disallows this action","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"Resource unavailable to this account","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"422":{"description":"Invalid request values","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"parameters":[{"name":"lessonId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"X-CSRF-Token","in":"header","required":true,"schema":{"type":"string"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/LessonInput"}}}}}
    delete: {"summary":"Archive a lesson and its active packs","description":"Requires student role.","responses":{"204":{"description":"Lesson archived"},"401":{"description":"Sign-in required or credentials invalid","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Role, account status, or request verification disallows this action","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"Resource unavailable to this account","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"parameters":[{"name":"lessonId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"X-CSRF-Token","in":"header","required":true,"schema":{"type":"string"}}]}
  "/v1/lessons/{lessonId}/generate":
    post: {"summary":"Generate and save a study pack","description":"Requires student role.","responses":{"201":{"description":"Generated pack identifier"},"401":{"description":"Sign-in required or credentials invalid","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Role, account status, or request verification disallows this action","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"Resource unavailable to this account","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"409":{"description":"Action conflicts with the current resource state","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"422":{"description":"Invalid request values","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"429":{"description":"Rate limit or generation quota reached","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"502":{"description":"Provider output failed validation","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"503":{"description":"Service or provider unavailable","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"parameters":[{"name":"lessonId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"X-CSRF-Token","in":"header","required":true,"schema":{"type":"string"}}]}
  "/v1/lessons/{lessonId}/packs":
    post: {"summary":"Save a study pack for an owned lesson","description":"Requires student role.","responses":{"201":{"description":"Created pack"},"401":{"description":"Sign-in required or credentials invalid","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Role, account status, or request verification disallows this action","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"Resource unavailable to this account","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"422":{"description":"Invalid request values","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"parameters":[{"name":"lessonId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"X-CSRF-Token","in":"header","required":true,"schema":{"type":"string"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PackInput"}}}}}
  "/v1/packs":
    get: {"summary":"List owned study packs","description":"Requires student role.","responses":{"200":{"description":"Page of packs"},"401":{"description":"Sign-in required or credentials invalid","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Role, account status, or request verification disallows this action","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"422":{"description":"Invalid request values","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"parameters":[{"name":"page","in":"query","schema":{"type":"integer","minimum":1,"default":1}},{"name":"q","in":"query","schema":{"type":"string"}},{"name":"sort","in":"query","schema":{"type":"string","enum":["newest","oldest"],"default":"newest"}},{"name":"lessonId","in":"query","schema":{"type":"string","format":"uuid"}}]}
  "/v1/packs/{packId}":
    get: {"summary":"Read an owned pack for review or editing","description":"Requires student role.","responses":{"200":{"description":"Pack details including editable study material"},"401":{"description":"Sign-in required or credentials invalid","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Role, account status, or request verification disallows this action","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"Resource unavailable to this account","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"parameters":[{"name":"packId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]}
    put: {"summary":"Replace the study content for future attempts","description":"Requires student role.","responses":{"200":{"description":"Updated pack"},"401":{"description":"Sign-in required or credentials invalid","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Role, account status, or request verification disallows this action","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"Resource unavailable to this account","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"422":{"description":"Invalid request values","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"parameters":[{"name":"packId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"X-CSRF-Token","in":"header","required":true,"schema":{"type":"string"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PackInput"}}}}}
    delete: {"summary":"Archive a study pack","description":"Requires student role.","responses":{"204":{"description":"Pack archived"},"401":{"description":"Sign-in required or credentials invalid","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Role, account status, or request verification disallows this action","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"Resource unavailable to this account","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"parameters":[{"name":"packId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"X-CSRF-Token","in":"header","required":true,"schema":{"type":"string"}}]}
  "/v1/attempts":
    get: {"summary":"List owned attempts","description":"Requires student role.","responses":{"200":{"description":"Page of attempt summaries"},"401":{"description":"Sign-in required or credentials invalid","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Role, account status, or request verification disallows this action","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"422":{"description":"Invalid request values","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"parameters":[{"name":"page","in":"query","schema":{"type":"integer","minimum":1,"default":1}},{"name":"q","in":"query","schema":{"type":"string"}},{"name":"sort","in":"query","schema":{"type":"string","enum":["newest","oldest"],"default":"newest"}}]}
    post: {"summary":"Start a practice attempt","description":"Requires student role.","responses":{"201":{"description":"Attempt and questions with choices"},"401":{"description":"Sign-in required or credentials invalid","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Role, account status, or request verification disallows this action","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"Resource unavailable to this account","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"422":{"description":"Invalid request values","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"parameters":[{"name":"X-CSRF-Token","in":"header","required":true,"schema":{"type":"string"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AttemptInput"}}}}}
  "/v1/attempts/{attemptId}":
    get: {"summary":"Read saved progress or final results","description":"Requires student role.","responses":{"200":{"description":"Attempt progress, answered feedback, and score after completion"},"401":{"description":"Sign-in required or credentials invalid","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Role, account status, or request verification disallows this action","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"Resource unavailable to this account","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"parameters":[{"name":"attemptId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]}
  "/v1/attempts/{attemptId}/answers":
    post: {"summary":"Submit an answer and get feedback","description":"Requires student role.","responses":{"200":{"description":"Feedback for the question and completion status"},"401":{"description":"Sign-in required or credentials invalid","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Role, account status, or request verification disallows this action","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"Resource unavailable to this account","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"409":{"description":"Action conflicts with the current resource state","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"422":{"description":"Invalid request values","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"parameters":[{"name":"attemptId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"X-CSRF-Token","in":"header","required":true,"schema":{"type":"string"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AnswerInput"}}}}}
  "/v1/attempts/{attemptId}/retry":
    post: {"summary":"Start a new attempt containing missed questions","description":"Requires student role.","responses":{"201":{"description":"Retry identifier and missed items as prompts and choices"},"401":{"description":"Sign-in required or credentials invalid","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Role, account status, or request verification disallows this action","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"Resource unavailable to this account","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"409":{"description":"Action conflicts with the current resource state","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"parameters":[{"name":"attemptId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"X-CSRF-Token","in":"header","required":true,"schema":{"type":"string"}}]}
  "/v1/reports":
    post: {"summary":"Report an issue with an owned question","description":"Requires student role.","responses":{"201":{"description":"Report identifier"},"401":{"description":"Sign-in required or credentials invalid","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Role, account status, or request verification disallows this action","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"Resource unavailable to this account","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"422":{"description":"Invalid request values","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"parameters":[{"name":"X-CSRF-Token","in":"header","required":true,"schema":{"type":"string"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ReportInput"}}}}}
  "/v1/admin/accounts":
    get: {"summary":"List accounts for administration","description":"Requires administrator role.","responses":{"200":{"description":"Page of account summaries"},"401":{"description":"Sign-in required or credentials invalid","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Role, account status, or request verification disallows this action","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"422":{"description":"Invalid request values","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"parameters":[{"name":"page","in":"query","schema":{"type":"integer","minimum":1,"default":1}},{"name":"q","in":"query","schema":{"type":"string"}},{"name":"sort","in":"query","schema":{"type":"string","enum":["newest","oldest"],"default":"newest"}}]}
  "/v1/admin/accounts/{accountId}":
    patch: {"summary":"Change an account's enabled status","description":"Requires administrator role.","responses":{"200":{"description":"Updated account status"},"401":{"description":"Sign-in required or credentials invalid","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Role, account status, or request verification disallows this action","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"Resource unavailable to this account","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"409":{"description":"Action conflicts with the current resource state","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"422":{"description":"Invalid request values","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"parameters":[{"name":"accountId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"X-CSRF-Token","in":"header","required":true,"schema":{"type":"string"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AccountStatus"}}}}}
  "/v1/admin/generation-runs":
    get: {"summary":"Review generation outcomes without private note text","description":"Requires administrator role.","responses":{"200":{"description":"Page of run metadata"},"401":{"description":"Sign-in required or credentials invalid","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Role, account status, or request verification disallows this action","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"422":{"description":"Invalid request values","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"parameters":[{"name":"page","in":"query","schema":{"type":"integer","minimum":1,"default":1}},{"name":"q","in":"query","schema":{"type":"string"}},{"name":"sort","in":"query","schema":{"type":"string","enum":["newest","oldest"],"default":"newest"}}]}
  "/v1/admin/reports":
    get: {"summary":"Review flagged issue categories and technical context","description":"Requires administrator role.","responses":{"200":{"description":"Page of reports"},"401":{"description":"Sign-in required or credentials invalid","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Role, account status, or request verification disallows this action","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"422":{"description":"Invalid request values","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}},"parameters":[{"name":"page","in":"query","schema":{"type":"integer","minimum":1,"default":1}},{"name":"q","in":"query","schema":{"type":"string"}},{"name":"sort","in":"query","schema":{"type":"string","enum":["newest","oldest"],"default":"newest"}}]}
components:
  securitySchemes: {"session":{"type":"apiKey","in":"cookie","name":"chapterlab_session"}}
  schemas:
    Credentials: {"type":"object","required":["email","password"],"properties":{"email":{"type":"string","format":"email"},"password":{"type":"string","format":"password"}}}
    LessonInput: {"type":"object","required":["title","notes"],"properties":{"title":{"type":"string","minLength":1,"maxLength":160},"notes":{"type":"string","minLength":1,"maxLength":6000}}}
    PackInput: {"type":"object","required":["title","guide","questions"],"properties":{"title":{"type":"string","minLength":1,"maxLength":160},"guide":{"type":"array","minItems":1,"items":{"$ref":"#/components/schemas/Concept"}},"comparison":{"type":"array","items":{"$ref":"#/components/schemas/Concept"}},"questions":{"type":"array","minItems":5,"maxItems":5,"items":{"$ref":"#/components/schemas/PackQuestion"}}}}
    Concept: {"type":"object","required":["label","description"],"properties":{"label":{"type":"string","minLength":1},"description":{"type":"string","minLength":1}}}
    PackQuestion: {"type":"object","required":["prompt","choices","correctChoice","explanation","paragraphId","quote"],"properties":{"prompt":{"type":"string","minLength":1},"choices":{"type":"array","minItems":4,"maxItems":4,"uniqueItems":true,"items":{"type":"string","minLength":1}},"correctChoice":{"type":"integer","minimum":0,"maximum":3},"explanation":{"type":"string","minLength":1},"paragraphId":{"type":"integer","minimum":1},"quote":{"type":"string","minLength":1}}}
    AttemptInput: {"type":"object","required":["packId"],"properties":{"packId":{"type":"string","format":"uuid"}}}
    AnswerInput: {"type":"object","required":["questionId","choice"],"properties":{"questionId":{"type":"string","format":"uuid"},"choice":{"type":"integer","minimum":0,"maximum":3}}}
    ReportInput: {"type":"object","required":["questionId","reason"],"properties":{"questionId":{"type":"string","format":"uuid"},"reason":{"type":"string","enum":["wrong_answer","unsupported_source","unclear_question"]}}}
    AccountStatus: {"type":"object","required":["enabled"],"properties":{"enabled":{"type":"boolean"}}}
    Error: {"type":"object","required":["code","message"],"properties":{"code":{"type":"string"},"message":{"type":"string"}}}
    Health: {"type":"object","required":["status","version","database"],"properties":{"status":{"type":"string"},"version":{"type":"string"},"database":{"type":"string"}}}
