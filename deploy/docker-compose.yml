# Local development only. Production = Render (Dockerfile) + Neon.
# Postgres only:  docker compose -f deploy/docker-compose.yml up -d db
# Full stack:     docker compose -f deploy/docker-compose.yml up --build
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: chapterlab
      POSTGRES_USER: chapterlab
      POSTGRES_PASSWORD: chapterlab
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chapterlab"]
      interval: 2s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: >-
        postgresql+psycopg://chapterlab:chapterlab@db:5432/chapterlab
      COOKIE_SECURE: "false"
      PROVIDER_MODE: ${PROVIDER_MODE:-stub}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports: ["8000:8000"]

volumes:
  pgdata:
