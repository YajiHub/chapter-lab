name: CI

on:
  pull_request:
  workflow_call:  # main pushes run CI via deploy.yml

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chapterlab
          POSTGRES_PASSWORD: chapterlab
          POSTGRES_DB: chapterlab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chapterlab"
          --health-interval 2s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: >-
        postgresql+psycopg://chapterlab:chapterlab@localhost:5432/chapterlab_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests with coverage
        run: uv run pytest --cov=app --cov-report=term --cov-fail-under=60
      - name: OpenAPI is committed and current
        run: |
          uv run python -m app.dump_openapi openapi.json
          git diff --exit-code openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types match backend/openapi.json
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Production image builds
        run: docker build -f deploy/Dockerfile -t chapterlab:ci .
